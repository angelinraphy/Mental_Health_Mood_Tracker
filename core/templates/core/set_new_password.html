{% extends 'core/base.html' %}
{% block content %}
<div class="row pt-5">
    <div class="col-md-6 offset-md-3">
        <div class="card shadow-sm border-success">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0 fw-bold">Set New Password</h5>
            </div>
            <div class="card-body p-4">
                <p>Your identity has been verified. Please enter your new password below.</p>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100 fw-bold mt-3 py-2 shadow-sm rounded-pill">Set New Password</button>
                    <a href="{% url 'login' %}" class="btn btn-outline-secondary w-100 fw-bold mt-2 py-2 rounded-pill">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
