{% extends 'core/base.html' %}
{% block content %}
<div class="mb-4 mt-4 text-center">
    <h2 class="fw-bold text-primary">Researcher Dashboard</h2>
    <p class="text-muted">Anonymized Macro Data Overview</p>
</div>
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-0 rounded-3">
            <div class="card-body">
                <canvas id="distributionChart"></canvas>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
    const entries = [
        {% for entry in entries %} {{ entry.mood_level }}, {% endfor %}
    ];
    let distribution = { low: 0, medium: 0, high: 0 };
    entries.forEach(level => {
        if (level < 4) distribution.low++;
        else if (level < 7) distribution.medium++;
        else distribution.high++;
    });

    const ctx = document.getElementById('distributionChart').getContext('2d');
    new Chart(ctx, {
        type: 'pie',
        data: {
            labels: ['Low (1-3)', 'Medium (4-6)', 'High (7-10)'],
            datasets: [{
                data: [distribution.low, distribution.medium, distribution.high],
                backgroundColor: ['#dc3545', '#ffc107', '#198754'],
                hoverOffset: 10
            }]
        },
        options: {
            plugins: {
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            let total = distribution.low + distribution.medium + distribution.high;
                            let percentage = ((context.raw / total) * 100).toFixed(1) + "%";
                            return percentage + " (" + context.raw + " entries)";
                        }
                    }
                }
            }
        }
    });
</script>
{% endblock %}
