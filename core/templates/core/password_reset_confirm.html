{% extends 'core/base.html' %}
{% block content %}
<div class="row pt-5">
    <div class="col-md-6 offset-md-3">
        <div class="card shadow-sm border-primary">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0 fw-bold">Set New Password</h5>
            </div>
            <div class="card-body p-4">
                {% if validlink %}
                    <form method="post" novalidate>
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary w-100 fw-bold mt-3 py-2 shadow-sm rounded-pill">Change Password</button>
                    </form>
                {% else %}
                    <div class="text-center py-4">
                        <h4 class="text-danger fw-bold mb-3">Invalid Link</h4>
                        <p class="text-muted">The password reset link was invalid!<br>It has either already been used, expired, or was copied incorrectly.</p>
                        <a href="{% url 'password_reset' %}" class="btn btn-outline-primary mt-3 px-4 rounded-pill">Request a new link</a>
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
