{% extends 'core/base.html' %}
{% block content %}
<div class="row pt-5">
    <div class="col-md-6 offset-md-3">
        <div class="card shadow-sm border-warning">
            <div class="card-header bg-warning">
                <h5 class="mb-0 fw-bold">Reset Password</h5>
            </div>
            <div class="card-body p-4">
                <p>Enter your email address below and we will send you a secure link to reset your account password.</p>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-warning w-100 fw-bold mt-3 py-2 shadow-sm rounded-pill">Send Reset Link</button>
                    <a href="{% url 'login' %}" class="btn btn-outline-secondary w-100 fw-bold mt-2 py-2 rounded-pill">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
