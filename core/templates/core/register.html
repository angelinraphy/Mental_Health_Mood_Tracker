{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card shadow-lg border-0 rounded-3">
            <div class="card-header bg-transparent border-0 text-center pb-0 pt-4">
                <h4 class="mb-0 fw-bold">Create Account</h4>
            </div>
            <div class="card-body p-4">
                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold mt-3">Register</button>
                </form>
                <div class="mt-4 text-center">
                    <p class="text-muted">Already have an account? <a href="{% url 'login' %}" class="text-decoration-none fw-bold">Login here</a>.</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
